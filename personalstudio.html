<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnbornedDream</title>
    <style>
        /* 基础重置与居中布局 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            /* 英文字体设置为 Times New Roman */
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 中文字体设置为黑体 */
        .chinese-text {
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
        }

        /* =========================================
           新增：老电视屏幕颗粒感/噪点遮罩
           ========================================= */
        .tv-noise {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 99;
            /* 在扫描线之下 */
            opacity: 0.08;
            /* 控制颗粒感的强度 */
            /* 使用 SVG 生成噪点纹理 */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: noise-anim 0.2s infinite;
        }

        /* 噪点跳动动画，模拟老电视信号不稳定 */
        @keyframes noise-anim {
            0% {
                transform: translate(0, 0);
            }

            10% {
                transform: translate(-2%, -2%);
            }

            20% {
                transform: translate(1%, -3%);
            }

            30% {
                transform: translate(3%, 1%);
            }

            40% {
                transform: translate(-1%, 3%);
            }

            50% {
                transform: translate(2%, 2%);
            }

            60% {
                transform: translate(-3%, -1%);
            }

            70% {
                transform: translate(1%, 3%);
            }

            80% {
                transform: translate(3%, -2%);
            }

            90% {
                transform: translate(-2%, 1%);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* CRT 屏幕扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(to bottom,
                    transparent,
                    transparent 2px,
                    rgba(200, 0, 0, 0.03) 2px,
                    rgba(200, 0, 0, 0.03) 4px);
            pointer-events: none;
            z-index: 100;
        }

        /* 屏幕暗角与微光 */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
        }

        /* 内容容器 */
        .content {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px;
        }

        /* 模拟 Logo (闭眼 / 两个半括号) */
        .logo-eyes {
            display: flex;
            gap: 40px;
            margin-bottom: 10px;
        }

        .eye {
            width: 60px;
            height: 15px;
            background-color: transparent;
            border-bottom: 8px solid #cc0000;
            border-radius: 50%;
        }

        /* 主标题：故障艺术效果 */
        .glitch-wrapper {
            position: relative;
        }

        .glitch {
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            color: #ffffff;
            margin: 0;
        }

        /* 故障红黑色阴影错位 */
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff0000;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 5s infinite linear;
        }

        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 #8b0000;
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 5s infinite linear;
        }

        /* 故障动画 */
                @keyframes glitch-anim-1 {
            0%, 40%, 60%, 100% { 
                clip-path: inset(50% 0 50% 0); 
                transform: translate(0, 0); 
            }
            42% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            46% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            50% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            54% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            58% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
        }

        @keyframes glitch-anim-2 {
            0%, 40%, 60%, 100% { 
                clip-path: inset(50% 0 50% 0); 
                transform: translate(0, 0); 
            }
            41% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 1px); }
            45% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, -1px); }
            49% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
            53% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 2px); }
            57% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
        }

        /* 中文副标题 */
        .subtitle {
            font-size: 1.2rem;
            color: #cc0000;
            letter-spacing: 8px;
            margin-left: 8px;
        }

        /* 个人信息 */
        .info {
            font-size: 0.95rem;
            color: #888888;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        /* 分割线 */
        .divider {
            width: 50px;
            height: 2px;
            background-color: #cc0000;
            margin: 10px 0;
        }

        /* 底部信息区 */
        .footer-info {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #666666;
            line-height: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .footer-info a {
            color: #666666;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-info a:hover {
            color: #ff3333;
        }

        .footer-info .placeholder {
            color: #666666;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .glitch {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
                letter-spacing: 4px;
            }

            .eye {
                width: 40px;
                height: 10px;
                border-bottom-width: 6px;
            }

            .footer-info {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- 老电视动态噪点遮罩 -->
    <div class="tv-noise"></div>

    <!-- 屏幕横纹滤镜 -->
    <div class="scanlines"></div>

    <div class="content">
        <!-- 模拟 Logo 视觉 -->
        <div class="logo-eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>

        <!-- 英文厂商名 (带故障动效) -->
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="UnbornedDream">UnbornedDream</h1>
        </div>

        <!-- 中文信息 -->
        <div class="subtitle chinese-text">空生梦</div>


        <!-- 底部联系方式与更新 -->
        <div class="footer-info chinese-text">
            <p>Email: <a href="mailto:crane010101@163.com">crane010101@163.com</a></p>
            <p>作品链接: <a href="https://www.taptap.cn/app/1068841" target="_blank" rel="noopener noreferrer">迷思域</a></p>
            <p>最近更新: <span class="placeholder">2026-11-20</span></p>
        </div>
    </div>

</body>

</html>
